<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunucu Hatası (500) — Application</title>
    <style>
        :root {
            --color-primary: #1E3A8A;
            --color-text-main: #1E293B;
            --color-text-muted: #64748B;
            --color-bg: #F8FAFC;
            --color-surface: #FFFFFF;
            --color-border: #E2E8F0;
            --radius-xl: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            max-width: 620px;
            width: 100%;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }
        .emoji { font-size: 72px; line-height: 1; margin-bottom: 20px; }
        .pill {
            display: inline-block;
            background: #FFEAEA;
            color: #E63946;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 14px; }
        p { font-size: 15px; color: var(--color-text-muted); line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            background: var(--color-primary);
            color: #FFFFFF;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="emoji" aria-hidden="true">⚙️</div>
        <span class="pill">500 — Sunucu Hatası</span>
        <h1>Beklenmeyen Bir Hata Oluştu</h1>
        <p>
            İsteğiniz işlenirken teknik bir aksaklık meydana geldi. Sistem mühendislerimiz durumdan haberdar edildi. Lütfen birkaç dakika sonra tekrar deneyin veya ana sayfaya dönün.
        </p>
        <a href="/" class="btn">🏠 Ana Sayfaya Dön</a>
    </div>
</body>
</html>
